---
name: Gradle

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        java: [11, 17, 21, 25]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: "gradle"
      - name: Run commands
        run: ./gradlew build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: omero-ldaptool ${{ matrix.java }}
          path: build/distributions/*
          retention-days: 30
          if-no-files-found: error
  release:
    name: Create release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    if: startswith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: omero-ldaptool 17
      - name: List artifacts
        run: ls -R
      - name: Create a GitHub release
        run: gh release create --generate-notes "${GITHUB_REF#refs/tags/}" omero-ldaptool/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
